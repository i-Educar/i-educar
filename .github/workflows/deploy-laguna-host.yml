# Deploy de paths do host (monorepo) → VPS Laguna.
# O reusable de pacotes só aceita packages/buriti|portabilis — painel/ACL ficam aqui.
#
# Secrets (repo ou Environment laguna-production):
#   LAGUNA_SSH_HOST, LAGUNA_SSH_USER, LAGUNA_SSH_KEY, LAGUNA_APP_PATH
#   LAGUNA_SSH_KNOWN_HOSTS, LAGUNA_DEPLOY_TOKEN
name: Deploy Laguna (host)

on:
  workflow_dispatch:
    inputs:
      paths:
        description: Paths relativos allowlisted, separados por vírgula
        type: string
        default: resources/views/dashboard
      clear_caches:
        description: Esvaziar caches Laravel após sync
        type: boolean
        default: true
  push:
    branches: [main, '2.12']
    paths:
      - 'resources/views/dashboard/**'
      - 'app/Menu.php'
      - 'app/Policies/ProcessPolicy.php'
      - 'app/Services/UserDashboardService.php'
      - '.github/workflows/deploy-laguna-host.yml'

concurrency:
  group: deploy-laguna-host-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy host paths → Laguna
    runs-on: ubuntu-latest
    environment: laguna-production
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolver paths allowlisted
        id: paths
        env:
          INPUT_PATHS: ${{ github.event.inputs.paths || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Allowlist estrita — não sync de árvore inteira.
          ALLOW='resources/views/dashboard|app/Menu.php|app/Policies/ProcessPolicy.php|app/Services/UserDashboardService.php|app/Http/Controllers/IdiarioSsoController.php'
          if [ -z "${INPUT_PATHS//[[:space:]]/}" ]; then
            if [ "$EVENT_NAME" = "push" ]; then
              INPUT_PATHS='resources/views/dashboard,app/Menu.php,app/Policies/ProcessPolicy.php,app/Services/UserDashboardService.php,app/Http/Controllers/IdiarioSsoController.php'
            else
              INPUT_PATHS='resources/views/dashboard'
            fi
          fi
          OUT=()
          IFS=',' read -ra RAW <<< "$INPUT_PATHS"
          for p in "${RAW[@]}"; do
            p="$(echo "$p" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$p" ] && continue
            case "$p" in
              *..*|/*|~*)
                echo "::error::Path rejeitado: $p"
                exit 1
                ;;
            esac
            ok=0
            IFS='|' read -ra A <<< "$ALLOW"
            for a in "${A[@]}"; do
              if [ "$p" = "$a" ] || [[ "$p" == "$a"/* ]]; then
                ok=1
                break
              fi
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::Path fora da allowlist: $p (permitidos: ${ALLOW//|/, })"
              exit 1
            fi
            if [ ! -e "$p" ]; then
              echo "::error::Path inexistente no checkout: $p"
              exit 1
            fi
            OUT+=("$p")
          done
          if [ "${#OUT[@]}" -eq 0 ]; then
            echo "::error::Nenhum path para sync"
            exit 1
          fi
          # Arquivo no workspace — multiline em GITHUB_OUTPUT + <<< só lia a 1ª linha.
          printf '%s\n' "${OUT[@]}" > "$GITHUB_WORKSPACE/deploy-host-paths.txt"
          echo "count=${#OUT[@]}" >> "$GITHUB_OUTPUT"
          echo "Paths (${#OUT[@]}): ${OUT[*]}"

      - name: Exigir secrets de deploy
        env:
          LAGUNA_SSH_HOST: ${{ secrets.LAGUNA_SSH_HOST }}
          LAGUNA_SSH_USER: ${{ secrets.LAGUNA_SSH_USER }}
          LAGUNA_SSH_KEY: ${{ secrets.LAGUNA_SSH_KEY }}
          LAGUNA_APP_PATH: ${{ secrets.LAGUNA_APP_PATH }}
          LAGUNA_SSH_KNOWN_HOSTS: ${{ secrets.LAGUNA_SSH_KNOWN_HOSTS }}
          LAGUNA_DEPLOY_TOKEN: ${{ secrets.LAGUNA_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for v in LAGUNA_SSH_HOST LAGUNA_SSH_USER LAGUNA_SSH_KEY LAGUNA_APP_PATH LAGUNA_SSH_KNOWN_HOSTS LAGUNA_DEPLOY_TOKEN; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Secret $v ausente (grave no Environment laguna-production ou repo)."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Preparar SSH (known_hosts fixo)
        env:
          KNOWN_HOSTS: ${{ secrets.LAGUNA_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.LAGUNA_SSH_KEY }}" > ~/.ssh/id_laguna
          chmod 600 ~/.ssh/id_laguna
          if [ -z "${KNOWN_HOSTS//[[:space:]]/}" ]; then
            echo "::error::LAGUNA_SSH_KNOWN_HOSTS vazio"
            exit 1
          fi
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' \
            'Host laguna' \
            '  HostName ${{ secrets.LAGUNA_SSH_HOST }}' \
            '  User ${{ secrets.LAGUNA_SSH_USER }}' \
            '  IdentityFile ~/.ssh/id_laguna' \
            '  IdentitiesOnly yes' \
            '  StrictHostKeyChecking yes' \
            '  UserKnownHostsFile ~/.ssh/known_hosts' > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh -o BatchMode=yes -o ConnectTimeout=15 laguna 'echo ok-ssh' >/dev/null

      - name: Sync rsync → servidor
        id: sync
        run: |
          set -euo pipefail
          APP="${{ secrets.LAGUNA_APP_PATH }}"
          SHA=$(git rev-parse --short HEAD)
          PATHS_FILE="$GITHUB_WORKSPACE/deploy-host-paths.txt"
          if [ ! -s "$PATHS_FILE" ]; then
            echo "::error::deploy-host-paths.txt ausente ou vazio"
            exit 1
          fi
          echo "Arquivo de paths:"; cat -A "$PATHS_FILE"
          # ssh/rsync não podem herdar o stdin do while (senão consomem o arquivo de paths).
          while IFS= read -r REL || [ -n "$REL" ]; do
            [ -z "$REL" ] && continue
            DEST="${APP}/${REL}"
            if [ -d "$REL" ]; then
              ssh -n laguna "mkdir -p '$DEST'"
              rsync -azc --delete \
                --no-perms --no-owner --no-group --omit-dir-times \
                --exclude '.git/' \
                "$REL"/ "laguna:${DEST}/" </dev/null
            else
              ssh -n laguna "mkdir -p '$(dirname "$DEST")'"
              rsync -azc \
                --no-perms --no-owner --no-group --omit-dir-times \
                "$REL" "laguna:${DEST}" </dev/null
            fi
            echo "Synced $REL @ $SHA → $DEST"
          done < "$PATHS_FILE"

      - name: Esvaziar caches Laravel
        if: ${{ always() && steps.sync.outcome == 'success' && (github.event_name == 'push' || github.event.inputs.clear_caches == 'true') }}
        run: |
          set -euo pipefail
          APP="${{ secrets.LAGUNA_APP_PATH }}"
          ssh laguna "bash -s" <<EOF
          set -euo pipefail
          cd '$APP'
          php_bin() {
            if id www-data >/dev/null 2>&1; then
              sudo -u www-data php "\$@"
            else
              php "\$@"
            fi
          }
          php_bin artisan view:clear || true
          php_bin artisan cache:clear || true
          php_bin artisan config:clear || true
          php_bin artisan route:clear || true
          EOF
